<div class="create-venue-container">
  <div class="header">
    <div class="header-left">
      <h2 class="title">Mekan Oluştur</h2>
      <p class="subtitle">Yeni bir etkinlik mekanı ekleyin ve kapasite, konum gibi detaylarını belirleyin.</p>
    </div>
    <div class="header-right">
      <app-ui-button variant="default" [routerLink]="['/admin/venues']">İptal</app-ui-button>
    </div>
  </div>

  @if (errorMessage()) {
    <div class="alert alert-danger">{{ errorMessage() }}</div>
  }

  <form [formGroup]="venueForm" (ngSubmit)="onSubmit()" class="venue-form" novalidate>
    <div class="form-section">
      <h3>Temel Bilgiler</h3>
      <div class="form-grid">
        <app-ui-input label="Mekan Adı" formControlName="name" [error]="fieldError('name')"></app-ui-input>
        <app-ui-input label="Kapasite" type="number" formControlName="capacity"
          hint="Yakında: bölümlerden hesaplanacak"></app-ui-input>
      </div>
    </div>

    <div class="form-section">
      <h3>Konum Detayları</h3>
      <div class="form-grid">
        <app-ui-input label="Şehir" formControlName="city" hint="Yakında"></app-ui-input>
        <app-ui-input label="Açık Adres" formControlName="address" [error]="fieldError('address')"></app-ui-input>
      </div>
    </div>

    <div class="form-actions">
      <app-ui-button variant="primary" type="submit" [class.disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Kaydediliyor...' : 'Mekanı Kaydet' }}
      </app-ui-button>
    </div>
  </form>
</div>
